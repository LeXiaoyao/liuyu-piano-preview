<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>刘妤钢琴工作室 · 微信小程序交互体验版</title>
<style>
  :root {
    --bg-primary: #FAF7F2;
    --bg-card: #FFFFFF;
    --bg-ebony: #231F20;
    --bg-ebony-soft: #2E2826;
    --gold-primary: #C89D66;
    --gold-deep: #A67B44;
    --gold-light: #FDF6EC;
    --gold-border: #E8D5B7;
    --text-main: #2C2623;
    --text-regular: #5C534C;
    --text-muted: #9E948A;
    --border-warm: #EFE8DC;
    --green-text: #287D56;
    --green-bg: #EBF7F1;
    --amber-text: #B86E14;
    --amber-bg: #FFF7E6;
    --red-text: #C94A4A;
    --red-bg: #FDEEEE;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #1B1817;
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ================= 桌面端双栏布局 (>= 540px) vs 手机端全屏 (< 540px) ================= */
  .app-stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 24px;
    background: radial-gradient(circle at 20% 20%, #2E2723 0%, #171413 70%);
  }

  .desktop-guide {
    width: 380px;
    color: #F5EDE2;
    flex-shrink: 0;
  }

  .dg-badge {
    display: inline-block;
    background: rgba(200, 157, 102, 0.2);
    border: 1px solid rgba(232, 201, 155, 0.45);
    color: #E8C99B;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }

  .dg-title {
    font-size: 28px;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.3;
    margin-bottom: 10px;
  }

  .dg-sub {
    font-size: 14px;
    color: #C7BBAE;
    line-height: 1.65;
    margin-bottom: 22px;
  }

  .dg-role-cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
  }

  .dg-role-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(232, 201, 155, 0.22);
    border-radius: 14px;
    padding: 12px 16px;
    color: #EAE0D5;
    cursor: pointer;
    text-align: left;
    transition: all 0.18s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .dg-role-btn:hover,
  .dg-role-btn.active {
    background: linear-gradient(135deg, rgba(200, 157, 102, 0.28) 0%, rgba(166, 123, 68, 0.18) 100%);
    border-color: #C89D66;
  }

  .dg-role-title {
    font-size: 14px;
    font-weight: 600;
    color: #FFFFFF;
    margin-bottom: 3px;
  }

  .dg-role-desc {
    font-size: 12px;
    color: #BCAE9E;
  }

  .dg-features {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px 18px;
    font-size: 12.5px;
    color: #D2C6B8;
    line-height: 1.75;
  }

  .dg-features strong {
    color: #E8C99B;
  }

  /* 真机容器 */
  .phone-shell {
    width: 390px;
    height: 844px;
    max-height: 95vh;
    background: var(--bg-primary);
    border-radius: 46px;
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.65), 0 0 0 10px #2C2725, 0 0 0 12px rgba(200, 157, 102, 0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }

  @media (max-width: 880px) {
    .desktop-guide {
      display: none;
    }
  }

  @media (max-width: 539px) {
    .app-stage {
      padding: 0;
      background: var(--bg-primary);
    }
    .phone-shell {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-height: none;
      border-radius: 0;
      box-shadow: none;
    }
  }

  /* ================= 顶部沉浸式角色切换条 + 微信小程序原生导航栏 ================= */
  .top-header-stack {
    background: #231F20;
    color: #FFFFFF;
    padding-top: env(safe-area-inset-top, 0px);
    flex-shrink: 0;
    z-index: 20;
  }

  .perspective-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px 6px;
    background: #191615;
    border-bottom: 1px solid rgba(200, 157, 102, 0.22);
  }

  .p-pill {
    flex: 1;
    text-align: center;
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 4px;
    border-radius: 999px;
    color: #BFB3A6;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.16s ease;
  }

  .p-pill.active {
    background: linear-gradient(135deg, #D4AF7A 0%, #B48448 100%);
    color: #FFFFFF;
    box-shadow: 0 2px 8px rgba(200, 157, 102, 0.35);
  }

  .wx-navbar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    position: relative;
  }

  .wx-nav-left {
    width: 72px;
    display: flex;
    align-items: center;
    font-size: 14px;
    color: #E8C99B;
    font-weight: 600;
    cursor: pointer;
  }

  .wx-nav-title {
    flex: 1;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: #FFFFFF;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .wx-capsule {
    width: 74px;
    height: 28px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    border: 0.5px solid rgba(255, 255, 255, 0.24);
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    flex-shrink: 0;
  }

  .wx-cap-dots {
    font-size: 12px;
    letter-spacing: 1px;
    color: #FFFFFF;
  }

  .wx-cap-line {
    width: 0.5px;
    height: 14px;
    background: rgba(255, 255, 255, 0.28);
  }

  .wx-cap-circle {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 1.8px solid #FFFFFF;
    position: relative;
  }

  .wx-cap-circle::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: #FFFFFF;
  }

  /* ================= 页面滚动主视口 ================= */
  .screen-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 13px 14px 24px;
    background: var(--bg-primary);
    scroll-behavior: smooth;
  }

  .screen-scroll::-webkit-scrollbar {
    width: 0;
    height: 0;
  }

  /* ================= 底部小程序 TabBar ================= */
  .wx-tabbar {
    height: calc(56px + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: #FFFFFF;
    border-top: 1px solid #ECE4D8;
    display: flex;
    align-items: center;
    justify-content: space-around;
    flex-shrink: 0;
    z-index: 20;
  }

  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 6px 0;
    cursor: pointer;
    color: #9E968C;
    position: relative;
  }

  .tab-btn.active {
    color: #B68548;
    font-weight: 600;
  }

  .tab-icon {
    font-size: 19px;
    line-height: 1.1;
  }

  .tab-txt {
    font-size: 11px;
  }

  .tab-dot-badge {
    position: absolute;
    top: 3px;
    right: 24%;
    background: #D97706;
    color: #FFFFFF;
    font-size: 10px;
    font-weight: 700;
    min-width: 16px;
    height: 16px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }

  /* ================= 施坦威黑金 + 香槟暖金 通用组件体系 ================= */
  .card {
    background: #FFFFFF;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 12px;
    border: 1px solid #EFE8DC;
    box-shadow: 0 4px 14px rgba(138, 110, 75, 0.05);
  }

  .card-ebony {
    background: linear-gradient(135deg, #2B2625 0%, #1B1716 100%);
    color: #F7EFE4;
    border-radius: 16px;
    padding: 16px 15px;
    margin-bottom: 12px;
    border: 1px solid rgba(200, 157, 102, 0.38);
    box-shadow: 0 8px 20px rgba(28, 24, 23, 0.16);
    position: relative;
    overflow: hidden;
  }

  /* 钢琴黑白键装饰分割条 */
  .piano-keys-bar {
    display: flex;
    height: 13px;
    background: #FFFFFF;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #E5DDD0;
    margin: 8px 0 13px;
  }

  .pk-w {
    flex: 1;
    border-right: 1px solid #EAE3D5;
    position: relative;
    background: linear-gradient(180deg, #FFFFFF 0%, #F7F3EB 100%);
  }

  .pk-w:last-child {
    border-right: none;
  }

  .pk-b {
    position: absolute;
    right: -3px;
    top: 0;
    width: 6px;
    height: 8px;
    background: #231F20;
    border-radius: 0 0 2px 2px;
    z-index: 2;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px 2px 10px;
  }

  .section-title {
    font-size: 15.5px;
    font-weight: 700;
    color: #2C2623;
    display: flex;
    align-items: center;
  }

  .section-title::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 15px;
    border-radius: 2px;
    background: linear-gradient(180deg, #D4AF7A 0%, #A87B46 100%);
    margin-right: 7px;
  }

  .section-more {
    font-size: 12px;
    color: #A67B44;
    font-weight: 600;
    cursor: pointer;
  }

  /* 按钮 */
  .btn {
    border: none;
    outline: none;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 13px;
    padding: 9px 18px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-gold {
    background: linear-gradient(135deg, #D4AF7A 0%, #B8894E 100%);
    color: #FFFFFF;
    box-shadow: 0 4px 10px rgba(184, 137, 78, 0.28);
  }

  .btn-ebony {
    background: linear-gradient(135deg, #2D2726 0%, #1D1918 100%);
    color: #E8C99B;
    border: 1px solid rgba(200, 157, 102, 0.42);
  }

  .btn-outline-gold {
    background: #FDF8F0;
    color: #A67B44;
    border: 1px solid #DFC39D;
  }

  .btn-outline {
    background: #FAF7F2;
    color: #5C534C;
    border: 1px solid #DED4C5;
  }

  .btn-danger-outline {
    background: #FFF6F6;
    color: #C94A4A;
    border: 1px solid #F0C2C2;
  }

  .btn-sm {
    padding: 6px 13px;
    font-size: 12px;
  }

  .btn-block {
    width: 100%;
    padding: 11px 18px;
    font-size: 14px;
  }

  /* 徽章 */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge-gold { background: #FDF6EC; color: #A67B44; border: 1px solid #E8D5B7; }
  .badge-green { background: #EBF7F1; color: #287D56; border: 1px solid #CBEBD9; }
  .badge-gray { background: #F2EFE9; color: #8C8278; border: 1px solid #E5DFD6; }
  .badge-warning { background: #FFF7E6; color: #B86E14; border: 1px solid #F3D69B; }
  .badge-danger { background: #FDEEEE; color: #C94A4A; border: 1px solid #F3C6C6; }
  .badge-trial { background: #ECFDF5; color: #1F7A54; border: 1px solid #A7E3C5; }

  .flower-pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: linear-gradient(135deg, #FFF5F5 0%, #FDF4E7 100%);
    color: #B85450;
    border: 1px solid #F2C9C4;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ================= 首页与琴童黑金卡 ================= */
  .hero-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .child-id-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .avatar-gold {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #D8B480 0%, #9E723B 100%);
    border: 2px solid rgba(255, 255, 255, 0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    flex-shrink: 0;
  }

  .child-name-main {
    font-size: 17px;
    font-weight: 700;
    color: #FFFFFF;
  }

  .switch-baby-chip {
    display: inline-block;
    font-size: 10.5px;
    color: #E8C99B;
    background: rgba(200, 157, 102, 0.22);
    border: 1px solid rgba(232, 201, 155, 0.45);
    padding: 1px 8px;
    border-radius: 999px;
    margin-left: 6px;
    cursor: pointer;
  }

  .child-stage {
    font-size: 11.5px;
    color: #D5C9BC;
    margin-top: 3px;
  }

  .metrics-dual {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(232, 201, 155, 0.2);
    border-radius: 12px;
    padding: 11px 8px;
    margin: 13px 0;
  }

  .metric-box {
    flex: 1;
    text-align: center;
    cursor: pointer;
  }

  .metric-num {
    font-size: 23px;
    font-weight: 700;
    color: #F2D3A2;
    line-height: 1.1;
  }

  .metric-unit {
    font-size: 11.5px;
    color: #D5C9BC;
    margin-left: 2px;
  }

  .metric-lbl {
    font-size: 11px;
    color: #C7B9AA;
    margin-top: 3px;
  }

  .metric-sep {
    width: 1px;
    height: 30px;
    background: rgba(255, 255, 255, 0.14);
  }

  .quick-grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
  }

  .qg-item {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 11px;
    padding: 9px 4px;
    text-align: center;
    cursor: pointer;
  }

  .qg-icon {
    width: 32px;
    height: 32px;
    margin: 0 auto 5px;
    border-radius: 10px;
    background: rgba(200, 157, 102, 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .qg-title {
    font-size: 12px;
    font-weight: 600;
    color: #FFFFFF;
  }

  .qg-sub {
    font-size: 10px;
    color: #C4B7A8;
    margin-top: 1px;
  }

  /* 近期提醒 */
  .next-card {
    border-left: 4px solid #C89D66;
    background: #FFFDF9;
    cursor: pointer;
  }

  .next-time-big {
    font-size: 15px;
    font-weight: 700;
    color: #231F20;
    margin: 6px 0 4px;
  }

  .next-clock-gold {
    color: #C89D66;
    margin-left: 8px;
  }

  /* 老师名片 */
  .teacher-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 11px;
  }

  .teacher-avatar-lg {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #D4AF7A 0%, #9E723B 100%);
    border: 2px solid rgba(255, 255, 255, 0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    flex-shrink: 0;
  }

  .teacher-name {
    font-size: 18px;
    font-weight: 700;
    color: #FFFFFF;
    margin-right: 7px;
  }

  .teacher-role-tag {
    font-size: 10.5px;
    color: #231F20;
    background: linear-gradient(90deg, #E8C99B 0%, #D4AF7A 100%);
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
  }

  .gold-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .gold-tag {
    font-size: 11px;
    color: #E8C99B;
    background: rgba(200, 157, 102, 0.16);
    border: 1px solid rgba(232, 201, 155, 0.35);
    padding: 2px 8px;
    border-radius: 6px;
  }

  .studio-contact-box {
    background: rgba(255, 255, 255, 0.07);
    border-radius: 10px;
    padding: 10px;
    margin-top: 11px;
  }

  /* ================= 二胎切换通用胶囊栏 ================= */
  .child-switcher {
    display: flex;
    align-items: center;
    gap: 7px;
    background: #FFFFFF;
    border: 1px solid #EAE1D3;
    border-radius: 12px;
    padding: 8px 11px;
    margin-bottom: 11px;
    overflow-x: auto;
  }

  .cs-chip {
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 12px;
    background: #FAF7F2;
    color: #5C534C;
    border: 1px solid #E6DEC8;
    cursor: pointer;
    white-space: nowrap;
  }

  .cs-chip.active {
    background: #231F20;
    color: #E8C99B;
    border-color: #C89D66;
    font-weight: 600;
  }

  /* ================= 21天约课横向日历与时段卡 ================= */
  .date-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .date-strip::-webkit-scrollbar {
    height: 0;
  }

  .date-box {
    width: 66px;
    flex-shrink: 0;
    padding: 9px 5px;
    border-radius: 11px;
    background: #FAF7F2;
    border: 1.5px solid #EFECE6;
    text-align: center;
    cursor: pointer;
    position: relative;
  }

  .date-box.active {
    background: linear-gradient(135deg, #241F1C 0%, #3A312C 100%);
    border-color: #C89D66;
    color: #FFFFFF;
  }

  .db-week { font-size: 11.5px; color: #6B6158; font-weight: 600; }
  .date-box.active .db-week { color: #E5C185; }
  .db-md { font-size: 14px; font-weight: 700; margin: 3px 0 5px; color: #231F20; }
  .date-box.active .db-md { color: #FFFFFF; }
  .db-cnt { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: #E8F5EE; color: #287D56; display: inline-block; }
  .date-box.active .db-cnt { background: rgba(200, 157, 102, 0.28); color: #E5C185; }
  .db-mine { position: absolute; top: 3px; right: 3px; background: #C89D66; color: #FFF; font-size: 9px; padding: 1px 4px; border-radius: 4px; }

  .slot-card {
    background: #FFFFFF;
    border-radius: 13px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #EFE8DC;
    border-left: 4px solid #287D56;
  }

  .slot-card.mine { border-left-color: #C89D66; background: #FFFDF9; }
  .slot-card.booked { border-left-color: #D5CFC7; background: #FDFBF8; }
  .slot-card.closed { border-left-color: #DDD6CC; background: #F8F5F0; opacity: 0.68; }

  .slot-time { font-size: 18px; font-weight: 700; color: #231F20; }
  .slot-meta { font-size: 12px; color: #8C827A; margin-top: 4px; display: flex; gap: 10px; }

  /* ================= 课表与 5 星课后陪练作业卡 ================= */
  .tabs-bar {
    display: flex;
    background: #FFFFFF;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 11px;
    border: 1px solid #EFE8DC;
  }

  .tab-pill {
    flex: 1;
    text-align: center;
    padding: 8px 2px;
    font-size: 12.5px;
    color: #8C827A;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    border-radius: 9px;
  }

    var navBack = document.getElementById('nav-back-btn');

    navBack.innerHTML = isSub ? '‹ 返回' : '';

    var titleMap = {
      home: '刘妤钢琴工作室',
      schedule: '预约排课 · 刘妤钢琴工作室',

    };

    if (State.tab === 'home') body.innerHTML = renderHome();
    else if (State.tab === 'schedule') body.innerHTML = renderSchedule();
    else if (State.tab === 'bookings') body.innerHTML = renderBookings();
    else if (State.tab === 'profile') body.innerHTML = renderProfile();
    else if (State.tab === 'practice') body.innerHTML = renderPractice();
    else if (State.tab === 'logs') body.innerHTML = renderLessonLogs();
    else if (State.tab === 'adm_dash') body.innerHTML = renderAdminDashboard();
    else if (State.tab === 'adm_slots') body.innerHTML = renderAdminSlots();
    else if (State.tab === 'adm_bookings') body.innerHTML = renderAdminBookings();
    else if (State.tab === 'adm_students') body.innerHTML = renderAdminStudents();

    // 底部 TabBar
    var tabbar = document.getElementById('wx-tabbar');
    if (isSub) {
      tabbar.style.display = 'none';
    } else {
      tabbar.style.display = 'flex';
      var items = State.role === 'teacher'
        ? [
            { k: 'adm_dash', icon: '📊', txt: '工作台', badge: DB.bookings.filter(function(b){return b.status==='leave_pending';}).length },
            { k: 'adm_slots', icon: '📅', txt: '排课档期' },

            { k: 'profile', icon: '👤', txt: '我的' }
          ];

        return '<div class="tab-btn ' + (State.tab === it.k ? 'active' : '') + '" id="tab-' + it.k + '" onclick="App.goTab(\'' + it.k + '\')">' +

  /* ================= 交互与弹窗方法集 ================= */
  var toastTimer = null;
  function showToast(msg) {
    var box = document.getElementById('toast-container');
    box.innerHTML = '<div class="wx-toast">' + msg + '</div>';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { box.innerHTML = ''; }, 2000);
  }

  function closeModal() {
    document.getElementById('modal-container').innerHTML = '';
  }

    toast: showToast,
    closeModal: closeModal,

    switchRole: function(role) {
      closeModal();
      State.role = role;

      document.getElementById('screen-body').scrollTop = 0;
      render();
    },

    goTab: function(tab) {
      closeModal();
      State.historyStack = [];
      State.tab = tab;
      document.getElementById('screen-body').scrollTop = 0;
      render();
    },

    openSubPage: function(sub) {
      closeModal();
      State.historyStack.push(State.tab);
      State.tab = sub;
      document.getElementById('screen-body').scrollTop = 0;
      render();
    },

    goBack: function() {
      var prev = State.historyStack.pop() || (State.role === 'teacher' ? 'adm_dash' : 'home');
      State.tab = prev;
      render();

      var kids = getBoundChildren();
      if (kids.length < 2) return;
      var idx = kids.findIndex(function(k) { return k.id === State.currentStudentId; });
      var next = kids[(idx + 1) % kids.length];
      State.currentStudentId = next.id;
      render();
      showToast('已切换宝贝：' + next.childName);
    },

    selectChild: function(id) {

    pickModalCourse: function(slotId, cn) {

    confirmRegularBook: function(slotId) {
      var slot = DB.slots.find(function(s) { return s.id === slotId; });
      var u = getActiveUser();
      if (!slot || !u) return;
      if (u.remainLessons < 1) {
        showToast('剩余课时不足，请联系刘妤老师续课');
        return;
      }
      var remInp = document.getElementById('book-remark-inp');
      var remark = remInp ? remInp.value : '常规回课与新曲学习';

      u.remainLessons -= 1;
      u.usedLessons += 1;
      var bkId = 'bk_' + Date.now();
      slot.status = 'booked';
      slot.studentId = u.id;
      slot.studentName = u.childName;
      slot.bookingId = bkId;

      DB.bookings.unshift({
        id: bkId, slotId: slot.id, userId: u.id, childName: u.childName, parentPhone: u.parentPhone,
        isTrial: false, date: slot.date, startTime: slot.startTime, endTime: slot.endTime, duration: slot.duration,
        courseName: State.modalBookCourse, roomName: slot.roomName, remark: remark, status: 'booked', canFreeCancel: true
      });
      DB.lessonLogs.unshift({
        id: 'lg_' + Date.now(), userId: u.id, typeLabel: '预约课程锁定', changeCount: -1, afterBalance: u.remainLessons,
        remark: '预约 ' + slot.date + ' ' + slot.startTime + ' ' + State.modalBookCourse, operator: '家长自主预约', time: '刚刚'
      });

      closeModal();
      render();
      showToast('🎉 预约成功！已扣 1 课时（余 ' + u.remainLessons + ' 节）');
    },

    confirmTrialBook: function(slotId) {
      var slot = DB.slots.find(function(s) { return s.id === slotId; });
      if (!slot) return;
      var tName = (document.getElementById('trial-name').value || '小满').trim();
      var tPhone = (document.getElementById('trial-phone').value || '13588996688').trim();

      var bkId = 'bk_trial_' + Date.now();
      slot.status = 'booked';
      slot.studentName = tName + ' (体验)';
      slot.isTrial = true;
      slot.bookingId = bkId;

      DB.bookings.unshift({
        id: bkId, slotId: slot.id, userId: '', childName: tName, parentPhone: tPhone,
        isTrial: true, date: slot.date, startTime: slot.startTime, endTime: slot.endTime, duration: 30,
        courseName: '1对1 钢琴体验课', roomName: slot.roomName, remark: '零基础首次试听', status: 'booked', canFreeCancel: true
      });
      closeModal();
      State.tab = 'bookings';
      render();
      showToast('🌱 体验课预约成功！期待宝贝到来');
    },

    cancelBooking: function(bkId) {
      var b = DB.bookings.find(function(x) { return x.id === bkId; });
      if (!b) return;
      b.status = 'cancelled';
      var slot = DB.slots.find(function(s) { return s.id === b.slotId; });
      if (slot) { slot.status = 'available'; slot.studentId = ''; slot.studentName = ''; slot.isTrial = false; }
      if (!b.isTrial && b.userId) {
        var stu = DB.students.find(function(s) { return s.id === b.userId; });
        if (stu) {
          stu.remainLessons += 1;
          stu.usedLessons = Math.max(0, stu.usedLessons - 1);
          DB.lessonLogs.unshift({
            id: 'lg_' + Date.now(), userId: stu.id, typeLabel: '请假取消退回', changeCount: 1, afterBalance: stu.remainLessons,
            remark: '取消 ' + b.date + ' ' + b.startTime + ' 课程，原路退回 1 课时', operator: '家长自助取消', time: '刚刚'
          });
        }
      }
      render();
      showToast(b.isTrial ? '已取消体验课预约' : '已取消预约，1 课时已原路退回');
    },

    /* 练琴打卡交互 */
    setPracMins: function(m) { State.practiceForm.mins = m; render(); },
    setPracRep: function(v) { State.practiceForm.repertoire = v; },
    setPracMood: function(m) { State.practiceForm.mood = m; render(); },

    submitPractice: function() {
      var u = getActiveUser() || DB.students[0];
      var first = !State.checkedInToday;
      if (first) {
        u.flowerCount += 1;
        u.practiceDays += 1;
        State.checkedInToday = true;
      }
      DB.practiceLogs.unshift({
        id: 'pl_' + Date.now(), userId: u.id, date: TODAY, durationMins: State.practiceForm.mins,
        repertoire: State.practiceForm.repertoire, mood: State.practiceForm.mood,
        parentNote: '宝贝今天按刘妤老师要求认真慢练完成打卡！', flowersEarned: first ? 1 : 0, teacherReply: ''
      });
      render();
      var mc = document.getElementById('modal-container');
      mc.innerHTML = '<div class="modal-mask center" onclick="App.closeModal()">' +
        '<div class="modal-dialog" onclick="event.stopPropagation()">' +
          '<div style="font-size:48px;margin-bottom:6px;">🌺</div>' +
          '<div style="font-size:18px;font-weight:700;color:#231F20;margin-bottom:6px;">太棒啦！今日练琴打卡成功</div>' +
          '<div style="font-size:13px;color:#6B6158;margin-bottom:12px;">奖励 +1 朵小红花，刘妤老师后台已同步收到提醒</div>' +
          '<div style="background:#FDF6EC;border:1px solid #E8D5B7;border-radius:999px;padding:7px 14px;font-size:12.5px;color:#7A5422;margin-bottom:15px;">' +
            '已累计点亮 <strong style="color:#B85450;font-size:15px;">' + u.flowerCount + '</strong> 朵小红花 · 坚持 <strong>' + u.practiceDays + '</strong> 天' +
          '</div>' +
          '<button class="btn btn-gold btn-block" onclick="App.closeModal()">继续加油 🎹</button>' +
        '</div>' +
      '</div>';
    },

    /* 老师后台核心交互 */
    handleLeave: function(bkId, mode) {
      var b = DB.bookings.find(function(x) { return x.id === bkId; });
      if (!b) return;
      b.status = 'cancelled';
      var slot = DB.slots.find(function(s) { return s.id === b.slotId; });
      if (slot) { slot.status = 'available'; slot.studentId = ''; slot.studentName = ''; }
      if (mode === 'refund' && b.userId) {
        var stu = DB.students.find(function(s) { return s.id === b.userId; });
        if (stu) stu.remainLessons += 1;
      }
      render();
      showToast(mode === 'refund' ? '✅ 已批准请假并退回 1 课时' : '已释放时段（按规则不退课时）');
    },

    batchGenerateWeekSlots: function() {
      DB.slots.push({
        id: 'slot_new_' + Date.now(), date: State.selectedDate, startTime: '20:30', endTime: '21:15',
        duration: 45, roomName: '1号施坦威三角琴房', status: 'available', studentId: '', studentName: '', bookingId: ''
      });
      render();
      showToast('⚡ 已按周批量生成未来 4 周开放档期！');
    },

    addSingleSlot: function() {
      DB.slots.push({
        id: 'slot_add_' + Date.now(), date: State.selectedDate, startTime: '15:00', endTime: '15:45',
        duration: 45, roomName: '2号立式钢琴房', status: 'available', studentId: '', studentName: '', bookingId: ''
      });
      render();
      showToast('已新增 15:00-15:45 可约时段');
    },

    toggleSlot: function(slotId) {
      var s = DB.slots.find(function(x) { return x.id === slotId; });
      if (!s) return;
      s.status = s.status === 'available' ? 'closed' : 'available';
      render();
      showToast(s.status === 'available' ? '已开放该时段' : '已设为休息关闭');
    },

    openFixedScheduleModal: function() {
      var mc = document.getElementById('modal-container');
      mc.innerHTML = '<div class="modal-mask" onclick="App.closeModal()">' +
        '<div class="modal-sheet" onclick="event.stopPropagation()">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
            '<strong style="font-size:15.5px;">📌 老生固定课位周期连排</strong>' +
            '<span style="color:#9E948A;cursor:pointer;" onclick="App.closeModal()">✕</span>' +
          '</div>' +
          '<div style="font-size:12.5px;color:#5C534C;line-height:1.7;background:#FAF7F2;padding:11px;border-radius:10px;margin-bottom:13px;">' +
            '<div>排课学员：<strong>苏茉茉（当前余 18 节）</strong></div>' +
            '<div>固定时间：<strong>每周六 10:30 - 11:15（连排 4 周）</strong></div>' +
            '<div>上课琴房：<strong>1号施坦威三角琴房</strong></div>' +
          '</div>' +
          '<button class="btn btn-gold btn-block" onclick="App.confirmFixedSchedule()">确认连排 4 周（自动扣减 4 课时）</button>' +
        '</div>' +
      '</div>';
    },

    confirmFixedSchedule: function() {
      var stu = DB.students.find(function(s) { return s.id === 'stu_momo'; });
      if (stu && stu.remainLessons >= 4) {
        stu.remainLessons -= 4;
        stu.usedLessons += 4;
        stu.fixedNote = '每周六 10:30-11:15 (1号施坦威三角琴房)';
      }
      closeModal();
      render();
      showToast('📌 已为苏茉茉连排未来 4 周固定课位！');
    },

    openCompleteModal: function(bkId) {
      var b = DB.bookings.find(function(x) { return x.id === bkId; });
      if (!b) return;
      var mc = document.getElementById('modal-container');
      mc.innerHTML = '<div class="modal-mask" onclick="App.closeModal()">' +
        '<div class="modal-sheet" onclick="event.stopPropagation()">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;">' +
            '<strong style="font-size:15.5px;">✅ 完课核销 · 发送课后陪练单</strong>' +
            '<span style="color:#9E948A;cursor:pointer;" onclick="App.closeModal()">✕</span>' +
          '</div>' +
          '<div style="font-size:12px;color:#5C534C;margin-bottom:6px;">课堂表现评分：<span class="star-gold">★★★★★ 5星（自动奖励 +2 朵🌺）</span></div>' +
          '<div style="font-size:12px;color:#5C534C;margin-bottom:4px;">本周布置曲目</div>' +
          '<input class="form-input" id="cmp-rep" value="《车尔尼599》第36条 + G大调音阶" style="margin-bottom:8px;" />' +
          '<div style="font-size:12px;color:#5C534C;margin-bottom:4px;">陪练重点与刘妤老师评语</div>' +
          '<textarea class="form-textarea" id="cmp-cmt">今天课堂专注度非常棒！回家注意右手连线呼吸，每天坚持慢练 25 分钟哦~</textarea>' +
          '<button class="btn btn-gold btn-block" style="margin-top:12px;" onclick="App.confirmComplete(\'' + bkId + '\')">发送陪练作业卡并奖励小红花</button>' +
        '</div>' +
      '</div>';
    },

    confirmComplete: function(bkId) {
      var b = DB.bookings.find(function(x) { return x.id === bkId; });
      if (b) {
        b.status = 'completed';
        b.ratingStars = 5;
        b.flowersAwarded = 2;
        b.repertoire = document.getElementById('cmp-rep').value;
        b.practiceFocus = '开节拍器 66 速度分手慢练，注意手腕放松';
        b.dailyTargetMins = 25;
        b.teacherComment = document.getElementById('cmp-cmt').value;
        var stu = DB.students.find(function(s) { return s.id === b.userId; });
        if (stu) stu.flowerCount += 2;
      }
      closeModal();
      render();
      showToast('🌸 已发送陪练作业单，奖励琴童 +2 朵小红花！');
    },

    openRechargeModal: function(stuId) {
      var s = DB.students.find(function(x) { return x.id === stuId; });
      if (!s) return;
      var mc = document.getElementById('modal-container');
      mc.innerHTML = '<div class="modal-mask" onclick="App.closeModal()">' +
        '<div class="modal-sheet" onclick="event.stopPropagation()">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
            '<strong style="font-size:15.5px;">➕ 课时续课登记 · ' + s.childName + '</strong>' +
            '<span style="color:#9E948A;cursor:pointer;" onclick="App.closeModal()">✕</span>' +
          '</div>' +
          '<div style="font-size:12px;color:#5C534C;margin-bottom:8px;">选择续课课包节数（当前剩余 ' + s.remainLessons + ' 节）：</div>' +
          '<div class="pill-row" style="margin-bottom:14px;">' +
            [12, 16, 20, 24].map(function(n) {
              return '<span class="choice-chip ' + (n === 16 ? 'active' : '') + '" onclick="document.getElementById(\'rcg-cnt\').value=' + n + '">+' + n + ' 节课时包</span>';
            }).join('') +
          '</div>' +
          '<input class="form-input" id="rcg-cnt" type="number" value="16" style="margin-bottom:12px;" />' +
          '<button class="btn btn-gold btn-block" onclick="App.confirmRecharge(\'' + stuId + '\')">确认入账并生成对账流水</button>' +
        '</div>' +
      '</div>';
    },

    confirmRecharge: function(stuId) {
      var s = DB.students.find(function(x) { return x.id === stuId; });
      var add = Number(document.getElementById('rcg-cnt').value || 16);
      if (s && add > 0) {
        s.remainLessons += add;
        s.totalLessons += add;
        DB.lessonLogs.unshift({
          id: 'lg_' + Date.now(), userId: s.id, typeLabel: '课时续课登记', changeCount: add, afterBalance: s.remainLessons,
          remark: '线下续课登记 +' + add + ' 节 1对1 钢琴课', operator: '刘妤老师录入', time: '刚刚'
        });
      }
      closeModal();
      render();
      showToast('✅ 已为 ' + s.childName + ' 增加 ' + add + ' 节课时！');
    },

    openShareInviteCard: function(stuId) {
      var s = DB.students.find(function(x) { return x.id === stuId; });
      if (!s) return;
      var mc = document.getElementById('modal-container');
      mc.innerHTML = '<div class="modal-mask center" onclick="App.closeModal()">' +
        '<div class="modal-dialog" onclick="event.stopPropagation()">' +
          '<div style="font-size:36px;margin-bottom:6px;">🎹</div>' +
          '<div style="font-size:16.5px;font-weight:700;color:#231F20;margin-bottom:4px;">微信专属绑定邀请卡</div>' +
          '<div style="font-size:12px;color:#7A6F66;margin-bottom:12px;">转发给「' + s.parentName + '」，家长点开即可一键认领绑定</div>' +
          '<div style="background:#FAF7F2;border:2px dashed #DFC39D;border-radius:12px;padding:12px;margin-bottom:14px;">' +
            '<div style="font-size:11px;color:#9E825E;">' + s.childName + ' · 6位专属绑定码</div>' +
            '<div style="font-size:26px;font-weight:700;letter-spacing:4px;color:#231F20;margin-top:3px;">' + s.bindCode + '</div>' +
          '</div>' +
          '<button class="btn btn-gold btn-block" onclick="App.closeModal();App.toast(\'在正式小程序中将直接唤起微信好友转发卡片\')">模拟转发给家长微信</button>' +
        '</div>' +
      '</div>';
    },

    /* 演示动画光圈辅助（供录制视频展示触控点） */
    showTouchAt: function(x, y) {
      var shell = document.getElementById('phone-shell');
      var r = document.createElement('div');
      r.className = 'touch-ripple';
      r.style.left = x + 'px';
      r.style.top = y + 'px';
      shell.appendChild(r);
      setTimeout(function() { if (r.parentNode) r.parentNode.removeChild(r); }, 550);
    },

    scrollBodyTo: function(topPx) {
      var el = document.getElementById('screen-body');
      el.style.scrollBehavior = 'auto';
      el.scrollTop = topPx;
    }
  };

  window.App = App;
  render();
})();
</script>
</body>
</html>
